<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Позвонить</title>
<style>
html,body{margin:0;height:100%;background:#1E272C;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.w{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
.n{font-size:28px;font-weight:800;letter-spacing:.5px}
a.c{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:340px;height:64px;border-radius:18px;background:#2E7D32;color:#fff;text-decoration:none;font-size:20px;font-weight:700}
p{color:#B0BEC5;font-size:14px;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="w">
  <div class="n" id="n"></div>
  <a class="c" id="c" href="#">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
    Позвонить
  </a>
  <a class="c" id="b" href="tg://resolve?domain=sushipak_hr_bot" style="background:#2C3A41;height:52px;font-size:16px">Вернуться в Telegram</a>
  <p>После звонка страница закроется сама и вернёт вас в приложение.</p>
</div>
<script>
var num = decodeURIComponent((location.hash || '').slice(1)).replace(/[^\d+]/g, '');
document.getElementById('n').textContent = num || 'Нет номера';
document.getElementById('c').href = 'tel:' + num;
var BOT = 'tg://resolve?domain=sushipak_hr_bot';
var left = false;
function backToTelegram() {
  try { window.close(); } catch (e) {}
  setTimeout(function () { location.href = BOT; }, 300);
}
// ушли на экран вызова → вернулись после звонка → закрываемся и возвращаемся в Telegram
document.addEventListener('visibilitychange', function () {
  if (document.hidden) left = true;
  else if (left) backToTelegram();
});
window.addEventListener('pageshow', function (e) { if (e.persisted && left) backToTelegram(); });
document.getElementById('b').addEventListener('click', function (e) { e.preventDefault(); backToTelegram(); });
if (num) setTimeout(function () { location.href = 'tel:' + num; }, 150);
</script>
</body>
</html>
